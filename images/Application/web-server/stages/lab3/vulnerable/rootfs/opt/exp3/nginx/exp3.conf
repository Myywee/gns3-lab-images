server {
    listen 80 default_server;
    server_name networking-experiments.nju-slab.cn networking-experiments-2.nju-slab.cn;
    server_tokens off;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    server_name networking-experiments.nju-slab.cn;
    server_tokens off;

    ssl_certificate     /etc/nginx/certs/networking-experiments.nju-slab.cn.fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/networking-experiments.nju-slab.cn.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/vuln_access.log;
    error_log  /var/log/nginx/vuln_error.log;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

server {
    listen 443 ssl;
    server_name networking-experiments-2.nju-slab.cn;
    server_tokens off;

    ssl_certificate     /etc/nginx/certs/networking-experiments.nju-slab.cn.fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/networking-experiments.nju-slab.cn.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /opt/exp3/evil-site;
    index index.html;
    access_log /var/log/nginx/evil_access.log;
    error_log  /var/log/nginx/evil_error.log;

    location / {
        try_files $uri $uri/ =404;
    }
}
